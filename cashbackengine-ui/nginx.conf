# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name rupiyabachao.in www.rupiyabachao.in;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name rupiyabachao.in www.rupiyabachao.in;
    root /usr/share/nginx/html;
    index index.html;

    # SSL certificates (mounted from host /etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/rupiyabachao.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rupiyabachao.in/privkey.pem;

    # Strong SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Angular HTML5 routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Spring Boot (internal docker network)
    location /api/ {
        proxy_pass http://cashbackengine-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
    }

    # Actuator health only
    location /actuator/health {
        proxy_pass http://cashbackengine-service:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Block all other actuator endpoints
    location /actuator/ {
        return 403;
    }

    # Cache static assets (Angular adds content hash to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
}
